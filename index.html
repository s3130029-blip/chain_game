<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>連鎖要塞 / CASCADE</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #14161c;
        color: #e8eaf0;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 12px;
      }
      .app__header {
        font-size: 1.1rem;
        font-weight: 700;
        padding: 8px 0 12px;
        text-align: center;
      }
      .editor { display: flex; flex-direction: column; gap: 12px; }

      /* パレット（ブラシ選択）: 横幅に応じて自動で折り返す */
      .palette {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        gap: 6px;
      }
      .palette__btn {
        padding: 8px 6px;
        border: 1px solid #3a3f4b;
        border-radius: 8px;
        background: #232733;
        color: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        touch-action: manipulation;
      }
      .palette__btn--active {
        border-color: #5b8cff;
        background: #2d3b5e;
        box-shadow: inset 0 0 0 1px #5b8cff;
      }

      /* 盤面（CSS Grid）: 列数は JS が gridTemplateColumns で指定 */
      .board {
        display: grid;
        gap: 2px;
        width: 100%;
        background: #2a2f3a;
        padding: 2px;
        border-radius: 8px;
        user-select: none;
      }
      .board__cell {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1f27;
        border-radius: 4px;
        cursor: pointer;
      }
      .board__cell--enemy-zone { background: #241b22; }
      .board__cell--player-zone { background: #1a2230; }

      .unit {
        position: relative;
        width: 86%;
        height: 86%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        font-weight: 700;
        font-size: clamp(0.8rem, 4.5vw, 1.3rem);
      }
      .unit--player { background: #2f6df6; color: #fff; }
      .unit--enemy { background: #e0533d; color: #fff; }
      .unit__arrow {
        position: absolute;
        top: 1px;
        right: 3px;
        font-size: 0.7em;
        opacity: 0.85;
      }

      .editor__footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        font-size: 0.85rem;
      }
      .cost { font-weight: 700; }
      .cost--over { color: #ff6b6b; }
      .hint { opacity: 0.8; }
      .hint--warn { color: #ffcc55; opacity: 1; }

      .code { display: flex; flex-direction: column; gap: 6px; }
      .code__buttons { display: flex; gap: 8px; }
      .code__btn {
        padding: 8px 12px;
        border: 1px solid #3a3f4b;
        border-radius: 8px;
        background: #232733;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .code__out {
        width: 100%;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        background: #0e1015;
        color: #cfe3ff;
        border: 1px solid #3a3f4b;
        border-radius: 8px;
        padding: 8px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
